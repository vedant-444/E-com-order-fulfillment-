apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orderflow360-ingress
  namespace: orderflow360-analytics
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
  - host: analytics.orderflow360.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: orderflow360-service
            port:
              number: 80
